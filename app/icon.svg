  <rect x="14.85" y="20.4" width="1.1" height="2.9" rx="0.35" fill="#ffffff" stroke="#0c7a68" stroke-width="0.4"/>
  <rect x="16.05" y="20.4" width="1.1" height="2.9" rx="0.35" fill="#ffffff" stroke="#0c7a68" stroke-width="0.4"/>
